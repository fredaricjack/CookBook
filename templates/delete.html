{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Recipe | CookBook</title>
    <link rel="stylesheet" href="{% static 'css/delete.css' %}">
    
</head>
<body>
<header class="navbar">
  <div class="nav-container">
    <a href="{% url 'home' %}" class="logo">🍃 CookBook</a>
    <nav class="nav-links">
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'recipe_list' %}">Recipes</a>
      <a href="{% url 'recipe_create' %}">Add Recipe</a>
    </nav>
    <a href="{% url 'recipe_create' %}" class="nav-button">+ Share Recipe</a>
  </div>
</header>
<main>

<section class="page-wrap"><div class="form-card confirm-card">
  <h1>Delete Recipe?</h1><p>Are you sure you want to permanently delete <strong>{{ cook.title }}</strong>?</p>
  <form method="post" action="{% url 'recipe_delete' cook.pk %}">{% csrf_token %}<button type="submit" class="danger-btn">Yes, Delete Recipe</button><a href="{% url 'recipe_detail' cook.pk %}" class="text-link">Cancel</a></form>
</div></section>

</main>
<footer class="footer">
  <h2>🍃 CookBook</h2>
  <p>Discover, Cook and Share Delicious Recipes.</p>
  <p class="copyright">© 2026 CookBook. All rights reserved.</p>
</footer>
</body>
</html>
